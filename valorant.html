  <script>
    // Look for .hamburger
    var hamburger = document.querySelector(".hamburger");
    var isOpen = false; // Track the state of the menu

    // On click
    hamburger.addEventListener("click", function () {
      // Toggle class "is-active"
      hamburger.classList.toggle("is-active");

      // Check if the menu is currently open or closed
      if (isOpen) {
        closeNav();
      } else {
        openNav();
      }

      // Toggle the state
      isOpen = !isOpen;
    });

    function openNav() {
      document.getElementById("mySidenav").style.width = "250px";
      document.getElementById("main").style.marginLeft = "250px";
    }

    function closeNav() {
      document.getElementById("mySidenav").style.width = "0";
      document.getElementById("main").style.marginLeft = "0";
    }
    function fadeIn() {
            document.getElementById("main").style.opacity = "1";
            document.getElementById("main").style.marginTop = "0px";

        }
  </script>

      <body>
        <h1>My Valorant Stats</h1>
  <div>
    <h2>Rank: <span id="rank"></span></h2>
    <img id="rank-icon" src="" alt="Rank Icon" style="height: 50px;">
    <p>Peak Rank: <span id="peak-rank"></span></p>
    <img id="peak-rank-icon" src="" alt="Peak Rank Icon" style="height: 50px;">
  </div>

  <script>
    async function fetchValorantData() {
      const url = "https://api.tracker.gg/api/v2/valorant/standard/profile/riot/I%20like%20SpaceX%23impac?forceCollect=true";

      try {
        const response = await fetch(url);
        const data = await response.json();

        // Extract rank data
        const rank = data.data.segments[0].stats.rank.metadata.tierName || "Unranked";
        const rankIcon = data.data.segments[0].stats.rank.metadata.iconUrl;

        const peakRank = data.data.segments[0].stats.peakRank.displayValue || "No Peak Rank";
        const peakRankIcon = data.data.segments[0].stats.peakRank.metadata.iconUrl;

        // Update the HTML
        document.getElementById("rank").textContent = rank;
        document.getElementById("rank-icon").src = rankIcon;

        document.getElementById("peak-rank").textContent = peakRank;
        document.getElementById("peak-rank-icon").src = peakRankIcon;

      } catch (error) {
        console.error("Error fetching data:", error);
      }
    }

    // Call the function to fetch and display data
    fetchValorantData();
  </script>
