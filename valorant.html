<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Website in progress...">
  <meta name="keywords" content="remym, impact, rmimpact, rm, impactfn, rmimpactfn, RMIMPACT, RmImpact">
  <link rel="icon" href="rm_custom_icon.png" type="image/png">
  <title>Games</title>
  <meta property="og:title" content="Rm Impact" />
  <meta property="og:description" content="Website in progress..." />
  <meta property="og:image" content="rm_custom_icon" />
  <meta property="og:url" content="rmimpactt.com" />
  <link href="hamburger.css" rel="stylesheet" type="text/css">
</head>

<body onload="fadeIn()">
  <div class="top_fade">
    <a href="home.html">
      <img src="white_nav_icon.png" class="top-right-logo" alt="Home">
    </a> 
  </div>
  
  <div id="mySidenav" class="sidenav">
    <a href="home.html">Home</a>
    <a href="youtube.html">YouTube</a>
    <a href="playlists.html">Playlists</a>
    <a href="about.html">About</a>
  </div>
  
  <div style="position: fixed; z-index: 4;">
    <div class="name"></div>
    <div class="hamburger hamburger--minus js-hamburger">
      <div class="hamburger-box">
        <div class="hamburger-inner"></div>
      </div>
    </div>
  </div>

  <div id="main">
    <div id="fadeIn">
      <div class="spacer"></div>
      <h2 style="font-size: 2rem;">Games</h2>
      
      <h1>My Valorant Stats</h1>
      <div>
        <h2>Rank: <span id="rank">Loading...</span></h2>
        <img id="rank-icon" src="" alt="Rank Icon" style="height: 50px;">
        <p>Peak Rank: <span id="peak-rank">Loading...</span></p>
        <img id="peak-rank-icon" src="" alt="Peak Rank Icon" style="height: 50px;">
      </div>
    </div>
  </div>

  <script>
    async function fetchValorantData() {
      const url = "https://api.tracker.gg/api/v2/valorant/standard/profile/riot/I%20like%20SpaceX%23impac?forceCollect=true";

      try {
        const response = await fetch(url);
        const data = await response.json();

        // Adjust the path as needed based on the JSON structure
        const rank = data.data.segments[0]?.stats?.rank?.metadata?.tierName || "Unranked";
        const rankIcon = data.data.segments[0]?.stats?.rank?.metadata?.iconUrl || "";
        const peakRank = data.data.segments[0]?.stats?.peakRank?.displayValue || "No Peak Rank";
        const peakRankIcon = data.data.segments[0]?.stats?.peakRank?.metadata?.iconUrl || "";

        // Update the HTML elements
        document.getElementById("rank").textContent = rank;
        document.getElementById("rank-icon").src = rankIcon;
        document.getElementById("rank-icon").alt = rank;

        document.getElementById("peak-rank").textContent = peakRank;
        document.getElementById("peak-rank-icon").src = peakRankIcon;
        document.getElementById("peak-rank-icon").alt = peakRank;

      } catch (error) {
        console.error("Error fetching data:", error);
        document.getElementById("rank").textContent = "Error loading rank";
        document.getElementById("peak-rank").textContent = "Error loading peak rank";
      }
    }

    fetchValorantData();

    function fadeIn() {
      document.getElementById("main").style.opacity = "1";
      document.getElementById("main").style.marginTop = "0px";
    }
  </script>
</body>
</html>
